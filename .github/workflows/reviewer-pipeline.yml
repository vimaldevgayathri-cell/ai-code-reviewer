name: AI Code Reviewer Pipeline

# 1. Tell GitHub when to run this automation
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]   # Runs when a PR is opened or updated

jobs:
  run-ai-reviewer:
    runs-on: ubuntu-latest         # Spin up a temporary Linux machine to run the job
    permissions:
      contents: read               # Read access to the repository contents
      pull-requests: write         # Write access to create PR comments
    steps:
      # Step A: Download the repository code onto the virtual machine
      - name: Checkout code
        uses: actions/checkout@v4

      # Step B: Install Python on the cloud machine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step C: Install the project tools (google-genai and requests)
      - name: Install project tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step D: Run the AI code reviewer script
      - name: Run Python Reviewer Script
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}   # Gemini key, stored in GitHub Secrets
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}       # Lets the script read the PR and post a comment
        run: python review.py